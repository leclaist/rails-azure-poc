services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
    environment:
      RAILS_ENV: development

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "bin/rails db:test:prepare && bin/rails test"
    volumes:
      - .:/rails
    environment:
      RAILS_ENV: test
    profiles:
      - test
